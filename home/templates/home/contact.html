{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - My Business</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="container">

            <div class="logo">
                My Business
            </div>

            <ul class="nav-links">

                <li>
                    <a href="/">Home</a>
                </li>

                <li>
                    <a href="/about/">About</a>
                </li>

                <li>
                    <a href="/services/">Services</a>
                </li>

                <li>
                    <a href="/contact/">Contact</a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Contact Section -->

    <section class="contact">

        <div class="container">

            <h1>Contact Us</h1>

            <p>
                Have a question? Send us a message.
            </p>


            {% if success %}

    <p>
        Thank you! Your message has been received.
    </p>

{% endif %}


            <form method="POST" action="{% url 'contact' %}">
                {% csrf_token %}

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Enter your message"
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>
            © 2026 My Business. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
